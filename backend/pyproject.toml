[project]
name = "thinkcanvas-backend"
version = "0.1.0"
description = "ThinkCanvas backend - AI agent that generates Manim videos"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Queue
    "redis>=5.0",
    "rq>=1.16",

    # AI / Agents
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-openai>=0.1",  # Used for DeepSeek (OpenAI-compatible API)

    # Logging
    "structlog>=24.1",

    # HTTP
    "httpx>=0.27",

    # Utils
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

# Tell setuptools to only package the `app` directory, ignoring
# `alembic/` (which is a config dir, not a Python package).
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
